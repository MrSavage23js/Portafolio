      <p>Después de revisar código ajeno en varios proyectos freelance, siempre encuentro los mismos patrones de error. Aquí van los <strong>5 más frecuentes</strong> y cómo corregirlos.</p>
      <h2>1. Usar var en lugar de const/let</h2>
      <p><code>var</code> tiene scope de función y hace hoisting, lo que genera bugs difíciles de detectar. Usa siempre <code>const</code> por defecto, y <code>let</code> solo cuando necesites reasignar.</p>
      <pre><code>// ❌ Mal
var usuario = 'Santiago';
// ✅ Bien
const usuario = 'Santiago';</code></pre>
      <h2>2. No manejar errores en async/await</h2>
      <p>El error más peligroso: hacer llamadas a APIs sin try/catch. Si falla la red, tu app se rompe silenciosamente.</p>
      <pre><code>// ❌ Sin manejo de errores
const data = await fetch('/api/datos').then(r => r.json());

// ✅ Con try/catch
try {
  const res = await fetch('/api/datos');
  if (!res.ok) throw new Error('Error ' + res.status);
  const data = await res.json();
} catch (err) {
  console.error('Falló la petición:', err);
}</code></pre>
      <h2>3. Comparar con == en lugar de ===</h2>
      <p>El operador <code>==</code> hace coerción de tipos y puede dar resultados inesperados. Siempre usa <code>===</code>.</p>
      <pre><code>0 == false   // true  ← peligroso
0 === false  // false ← correcto</code></pre>
      <h2>4. Mutar el estado directamente en React</h2>
      <p>Esto causa que React no detecte los cambios y el componente no se re-renderice.</p>
      <pre><code>// ❌ Mutación directa
state.items.push(nuevoItem);

// ✅ Nuevo array
setItems([...items, nuevoItem]);</code></pre>
      <h2>5. Olvidar limpiar event listeners</h2>
      <p>Si agregas listeners dentro de componentes sin removerlos, acumulas memoria y causas comportamientos raros.</p>

  window.addEventListener('resize', handleResize);

      <blockquote>El buen código no es el que funciona, es el que otro desarrollador puede entender y mantener.</blockquote>

      <p>Esta es sin duda la pregunta más común en entrevistas de frontend junior. Y la respuesta honesta es: <strong>depende</strong>. Pero hay reglas claras que te ayudan a decidir.</p>
      <h2>Flexbox: para una dimensión</h2>
      <p>Flexbox es ideal cuando organizas elementos en <strong>una sola dirección</strong> (horizontal o vertical).</p>
      <pre><code>/* Navbar con items alineados */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Centrar un elemento */
.contenedor {
  display: flex;
  align-items: center;
  justify-content: center;
}</code></pre>
      <h2>Grid: para dos dimensiones</h2>
      <p>CSS Grid brilla cuando necesitas controlar <strong>filas y columnas al mismo tiempo</strong>.</p>
      <pre><code>/* Layout de página completa */
.app {
  display: grid;
  grid-template-columns: 250px 1fr;
  grid-template-rows: 60px 1fr 40px;
  min-height: 100vh;
}

/* Grid responsivo sin media queries */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
}</code></pre>
      <h2>La regla de oro</h2>
      <ul>
        <li><strong>¿Barra de navegación, botones en línea, centrar un elemento?</strong> → Flexbox</li>

        <li><strong>¿No sabes cuántos elementos habrá?</strong> → Grid con auto-fill</li>
      </ul>

.contenedor {
  display: grid;
  place-items: center;
}</code></pre>

      <p>Una de las cosas que más confunde a los developers junior es cómo organizar un proyecto React. No hay una respuesta única, pero sí hay patrones probados que evitan el caos a medida que el proyecto crece.</p>
      <h2>La estructura que uso</h2>
      <pre><code>src/
├── components/     # Componentes reutilizables
│   ├── Button/
│   │   ├── Button.jsx
│   │   ├── Button.css
│   │   └── index.js
├── pages/          # Vistas completas
│   ├── Home.jsx
│   └── About.jsx
├── hooks/          # Custom hooks
│   └── useWeather.js
├── services/       # Llamadas a APIs
│   └── weatherApi.js
├── context/        # Estado global
│   └── AuthContext.jsx
├── utils/          # Funciones helpers
│   └── formatDate.js
└── assets/         # Imágenes, fuentes</code></pre>
      <h2>Reglas que sigo siempre</h2>
      <ul>
        <li><strong>Un componente = una carpeta</strong> con su CSS y su index.js</li>
        <li><strong>Las páginas no tienen lógica</strong>, solo componen componentes</li>
        <li><strong>La lógica de API va en services/</strong>, nunca directo en el componente</li>
        <li><strong>Los custom hooks</strong> son para reusar lógica con estado</li>
      </ul>
      <h2>El patrón Container/Presenter</h2>
      <p>Separa los componentes en dos tipos:</p>
      <ul>
        <li><strong>Container:</strong> maneja estado y lógica, no tiene estilos</li>
        <li><strong>Presenter:</strong> solo recibe props y renderiza, fácil de testear</li>
      </ul>
      <blockquote>Si tu componente tiene más de 150 líneas, probablemente debería dividirse en dos. La simplicidad es una feature.</blockquote>

// Hooks: camelCase con "use"
useProductSearch.js

// Servicios: camelCase con Api
productsApi.js

// Constantes: SCREAMING_SNAKE_CASE

// ════════════════════════════════
//   STATE
// ════════════════════════════════
let currentView   = 'home'; // 'home' | 'post'
let currentPost   = null;
let currentCat    = 'todos';
let searchQuery   = '';

const categories = ['todos', 'javascript', 'css', 'rendimiento', 'python', 'carrera'];

// ════════════════════════════════
//   ROUTER
// ════════════════════════════════
function goHome() {
  currentView = 'home';
  currentPost = null;
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function goPost(id) {
  currentView = 'post';
  currentPost = posts.find(p => p.id === id);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function setCategory(cat) {
  currentCat = cat;
  render();
}

function onSearch(val) {
  searchQuery = val.toLowerCase().trim();
  render();
}

// ════════════════════════════════
//   RENDER
// ════════════════════════════════
function render() {
  const main = document.getElementById('main');
  if (currentView === 'home') renderHome(main);
  else renderPost(main);
}

function renderHome(el) {
  const featured = posts.find(p => p.featured);

  let visible = posts.filter(p => {
    const matchCat = currentCat === 'todos' || p.category === currentCat;
    const matchSearch = !searchQuery ||
      p.title.toLowerCase().includes(searchQuery) ||
      p.excerpt.toLowerCase().includes(searchQuery) ||
      p.tags.some(t => t.includes(searchQuery));
    return matchCat && matchSearch;
  });

  const gridPosts = searchQuery
    ? visible
    : visible.filter(p => !p.featured || currentCat !== 'todos');

  el.innerHTML = `
    <div class="page">
      <div class="blog-hero">
        <div class="blog-tag">Blog personal</div>
        <h1 class="blog-title">Código,<br><span>experiencias</span><br>& tips reales.</h1>
        <p class="blog-sub">Artículos sobre desarrollo web, JavaScript, CSS, Python y lo que aprendo construyendo proyectos reales.</p>
      </div>

      <div class="cats-wrap">
        ${categories.map(c => `
          <button class="cat-btn ${currentCat===c?'active':''}" onclick="setCategory('${c}')">
            ${c === 'todos' ? 'Todos' : c}
          </button>
        `).join('')}
      </div>

      ${searchQuery ? '' : (currentCat === 'todos' && featured ? `
        <div class="featured" onclick="goPost(${featured.id})">
          <div class="featured-label">✦ Artículo destacado</div>
          <h2 class="featured-title">${featured.title}</h2>
          <p class="featured-excerpt">${featured.excerpt}</p>
          <div class="post-meta">
            <span class="post-cat ${featured.category}">${featured.category}</span>
            <span class="post-date">${featured.date}</span>
            <span class="read-time">📖 ${featured.readTime} de lectura</span>
          </div>
        </div>
      ` : '')}

      ${gridPosts.length === 0 ? `
        <div class="empty-search">
          <span>🔍</span>
          <strong>No hay resultados para "${searchQuery}"</strong><br>
          Intenta con otro término o explora las categorías
        </div>
      ` : `
        <div class="posts-grid">
          ${gridPosts.map(p => `
            <div class="post-card" onclick="goPost(${p.id})">
              <div class="post-meta">
                <span class="post-cat ${p.category}">${p.category}</span>
                <span class="read-time">📖 ${p.readTime}</span>
              </div>
              <h3 class="post-card-title">${p.title}</h3>
              <p class="post-card-excerpt">${p.excerpt}</p>
              <div class="post-card-footer">
                <span class="post-date">${p.date}</span>
                <span style="font-size:0.72rem;color:var(--red)">Leer →</span>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

function renderPost(el) {
  const p = currentPost;
  const related = posts.filter(r => r.id !== p.id && (r.category === p.category || r.tags.some(t => p.tags.includes(t)))).slice(0, 3);

  el.innerHTML = `
    <div class="page narrow">
      <button class="back-btn" onclick="goHome()"> Volver al blog</button>
      <div class="post-header">
        <div class="post-meta">
          <span class="post-cat ${p.category}">${p.category}</span>
          <span class="post-date">${p.date}</span>
          <span class="read-time">📖 ${p.readTime} de lectura</span>
        </div>
        <h1 class="post-header-title">${p.title}</h1>
        <p class="post-lead">${p.excerpt}</p>
      </div>

      <div class="post-body">${p.body}</div>

      <div class="post-tags">
        ${p.tags.map(t => `<span class="ptag">#${t}</span>`).join('')}
      </div>

      ${related.length ? `
        <div class="related-title">También te puede interesar</div>
        <div class="related-grid">
          ${related.map(r => `
            <div class="related-card" onclick="goPost(${r.id})">
              <h4>${r.title}</h4>
              <p>${r.date} · ${r.readTime}</p>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// INIT
render();
</script>
