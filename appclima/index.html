<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>App del Clima | dev.savage</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;
  --surface:#111111;
  --surface2:#181818;
  --surface3:#202020;
  --border:#2a1a1a;
  --border2:#3a1a1a;
  --red:#ff2020;
  --red-dim:rgba(255,32,32,0.1);
  --red-glow:rgba(255,32,32,0.25);
  --blue:#5bc4f5;
  --text:#f0eded;
  --muted:#806060;
  --muted2:#4a2a2a;
  --mono:'DM Mono',monospace;
  --head:'Syne',sans-serif;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--mono)}
body{
  background-image:
    radial-gradient(ellipse 700px 500px at 80% -10%, rgba(91,196,245,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 500px 400px at -5% 100%, rgba(255,32,32,0.07) 0%, transparent 60%);
}
.app{max-width:900px;margin:0 auto;padding:2.5rem 1.5rem 5rem}

/* HEADER */
.logo{font-family:var(--head);font-size:0.72rem;font-weight:700;color:var(--red);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:0.6rem}
.title{font-family:var(--head);font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-0.03em;line-height:1;margin-bottom:2rem}
.title span{color:var(--red)}

/* SEARCH */
.search-bar{display:flex;gap:0.75rem;margin-bottom:0.75rem;flex-wrap:wrap}
.search-input{
  flex:1;min-width:200px;
  background:var(--surface);border:1px solid var(--border2);border-radius:6px;
  padding:0.85rem 1.2rem;
  font-family:var(--mono);font-size:0.9rem;color:var(--text);
  outline:none;transition:border-color 0.2s;
}
.search-input:focus{border-color:var(--red)}
.search-input::placeholder{color:var(--muted2)}
.btn-loc{
  background:var(--surface);border:1px solid var(--border2);
  color:var(--muted);padding:0.85rem 1rem;border-radius:6px;
  cursor:pointer;transition:all 0.2s;font-size:1.1rem;
}
.btn-loc:hover{border-color:var(--red);color:var(--red)}
.btn-search{
  background:var(--red);color:#080808;border:none;
  padding:0.85rem 1.8rem;border-radius:6px;
  font-family:var(--mono);font-size:0.82rem;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.btn-search:hover{background:#ff3a3a;box-shadow:0 6px 24px var(--red-glow);transform:translateY(-1px)}
.btn-search:active{transform:scale(0.97)}

/* RECENTS */
.recents{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:2rem;min-height:1.5rem}
.recent-chip{
  padding:0.3rem 0.75rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;
  font-size:0.7rem;color:var(--muted);cursor:pointer;transition:all 0.15s;
}
.recent-chip:hover{border-color:var(--red);color:var(--text)}

/* LOADER */
.loader{display:flex;justify-content:center;padding:4rem;gap:0.5rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:bounce 1s ease-in-out infinite}
.dot:nth-child(2){animation-delay:0.15s}
.dot:nth-child(3){animation-delay:0.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-14px);opacity:1}}

/* STATUS */
.status-msg{text-align:center;padding:4rem 1rem;font-size:0.85rem;color:var(--muted);line-height:1.9}
.status-msg .icon{font-size:2.5rem;margin-bottom:1rem;display:block}
.status-msg.err .icon{animation:shake 0.4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* WEATHER MAIN */
.weather-main{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.current-card{
  background:var(--surface);border:1px solid var(--border2);border-radius:10px;
  padding:1.8rem;position:relative;overflow:hidden;
}
.current-card::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle, rgba(91,196,245,0.07) 0%, transparent 70%);
  pointer-events:none;
}
.city-name{font-family:var(--head);font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.city-country{font-size:0.72rem;color:var(--muted);letter-spacing:0.12em;margin-top:0.2rem;margin-bottom:1.2rem}
.weather-icon-big{font-size:4rem;line-height:1;margin-bottom:0.5rem;filter:drop-shadow(0 0 20px rgba(91,196,245,0.3))}
.temp-main{font-family:var(--head);font-size:4rem;font-weight:800;letter-spacing:-0.04em;line-height:1}
.temp-unit{font-size:1.5rem;color:var(--muted)}
.weather-desc{font-size:0.85rem;color:var(--muted);text-transform:capitalize;margin-top:0.3rem;margin-bottom:0.5rem}
.feels-like{font-size:0.75rem;color:var(--muted);margin-bottom:1.2rem}
.feels-like span{color:var(--text)}
.quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.qs{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0.7rem 0.9rem}
.qs-label{font-size:0.6rem;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.2rem}
.qs-val{font-size:0.95rem;font-weight:500;color:var(--text)}

.sun-card{
  background:var(--surface);border:1px solid var(--border2);border-radius:10px;
  padding:1.5rem;display:flex;flex-direction:column;
}
.sun-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:0.75rem 0;border-bottom:1px solid var(--border);
}
.sun-row:last-child{border-bottom:none}
.sun-label{font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase}
.sun-val{font-size:0.95rem;font-weight:500}
.sun-icon{font-size:1.3rem}

/* HOURLY */
.section-label{
  display:flex;align-items:center;gap:0.75rem;
  font-size:0.68rem;color:var(--red);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:1rem;
}
.section-label::before{content:'';display:block;width:16px;height:1px;background:var(--red)}
.hourly-scroll{display:flex;gap:0.65rem;overflow-x:auto;padding-bottom:0.5rem;margin-bottom:2rem}
.hourly-scroll::-webkit-scrollbar{height:3px}
.hourly-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.hc{
  background:var(--surface);border:1px solid var(--border);border-radius:7px;
  padding:0.9rem 0.75rem;text-align:center;flex-shrink:0;width:80px;transition:all 0.2s;
}
.hc:first-child{border-color:var(--red);background:var(--red-dim)}
.hc:hover{transform:translateY(-2px)}
.hc-time{font-size:0.65rem;color:var(--muted);margin-bottom:0.4rem}
.hc-icon{font-size:1.4rem;margin-bottom:0.3rem}
.hc-temp{font-size:0.88rem;font-weight:600}
.hc-rain{font-size:0.6rem;color:var(--blue);margin-top:0.2rem}

/* FORECAST */
.forecast-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0.75rem;margin-bottom:2rem}
.fc{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:1rem 0.75rem;text-align:center;transition:all 0.2s;
}
.fc:hover{border-color:var(--border2);transform:translateY(-2px)}
.fc-day{font-size:0.68rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.5rem}
.fc-icon{font-size:1.8rem;margin-bottom:0.4rem;line-height:1}
.fc-hi{font-size:0.95rem;font-weight:700}
.fc-lo{font-size:0.75rem;color:var(--muted);margin-top:0.1rem}
.fc-desc{font-size:0.62rem;color:var(--muted);margin-top:0.3rem;text-transform:capitalize}

@media(max-width:640px){
  .weather-main{grid-template-columns:1fr}
  .forecast-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="app">

  <div class="logo">dev.savage · weather app</div>
  <h1 class="title">App del <span>Clima</span></h1>

  <div class="search-bar">
    <input class="search-input" id="cityInput" placeholder="Buscar ciudad... ej: Ciudad de México"/>
    <button class="btn-loc" onclick="getByLocation()" title="Usar mi ubicación">📍</button>
    <button class="btn-search" onclick="search()">Buscar</button>
  </div>
  <div class="recents" id="recents"></div>
  <div id="content">
    <div class="status-msg">
      <span class="icon">🌤️</span>
      <strong>Busca una ciudad para comenzar</strong><br>
      Escribe el nombre de cualquier ciudad del mundo
    </div>
  </div>

</div>
<script>
// ============================================================
//  PEGA TU API KEY AQUÍ ↓  (solo cambia este valor)
// ============================================================
const API_KEY = 'cf3d2a77535f0f970edf634e84aec35e';
// ============================================================

const API = 'https://api.openweathermap.org/data/2.5';
let recents = JSON.parse(localStorage.getItem('savage_weather_recents') || '[]');

// RECENTS
function addRecent(city) {
  recents = [city, ...recents.filter(c => c.toLowerCase() !== city.toLowerCase())].slice(0, 6);
  localStorage.setItem('savage_weather_recents', JSON.stringify(recents));
  renderRecents();
}
function renderRecents() {
  document.getElementById('recents').innerHTML = recents.map(c =>
    `<div class="recent-chip" onclick="searchCity('${c}')">${c}</div>`
  ).join('');
}
renderRecents();

// SEARCH
function search() {
  const city = document.getElementById('cityInput').value.trim();
  if (city) searchCity(city);
}
function searchCity(city) {
  document.getElementById('cityInput').value = city;
  fetchByCity(city);
}
document.getElementById('cityInput').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

function getByLocation() {
  if (!navigator.geolocation) { showError('Tu navegador no soporta geolocalización'); return; }
  showLoader();
  navigator.geolocation.getCurrentPosition(
    pos => fetchByCoords(pos.coords.latitude, pos.coords.longitude),
    ()  => showError('No se pudo obtener tu ubicación')
  );
}

// FETCH por ciudad
async function fetchByCity(city) {
  showLoader();
  try {
    const [cur, fore] = await Promise.all([
      fetch(`${API}/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=es`).then(r => { if (!r.ok) throw r.status; return r.json(); }),
      fetch(`${API}/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=es`).then(r => r.json())
    ]);
    addRecent(cur.name);
    renderWeather(cur, fore);
  } catch(e) {
    if (e === 401) showError('🔑 API Key inválida o aún no activada.\nEspera hasta 2 horas desde que la creaste en OpenWeather.');
    else if (e === 404) showError('🔍 Ciudad no encontrada.\nIntenta con otro nombre o revisa la ortografía.');
    else showError('❌ Error de conexión. Revisa tu internet e inténtalo de nuevo.');
  }
}

// FETCH por coordenadas (📍 y geolocalización)
async function fetchByCoords(lat, lon) {
  showLoader();
  try {
    const [cur, fore] = await Promise.all([
      fetch(`${API}/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=es`).then(r => { if (!r.ok) throw r.status; return r.json(); }),
      fetch(`${API}/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=es`).then(r => r.json())
    ]);
    addRecent(cur.name);
    renderWeather(cur, fore);
  } catch(e) {
    showError('❌ No se pudo obtener el clima de tu ubicación.');
  }
}

// RENDER
function renderWeather(cur, fore) {
  const sunrise = new Date(cur.sys.sunrise * 1000).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  const sunset  = new Date(cur.sys.sunset  * 1000).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  const updated = new Date(cur.dt * 1000).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  const icon    = weatherIcon(cur.weather[0].id, cur.weather[0].icon.includes('d'));

  // Agrupar forecast por día
  const days = {};
  fore.list.forEach(item => {
    const d = item.dt_txt.split(' ')[0];
    if (!days[d]) days[d] = [];
    days[d].push(item);
  });
  const forecastDays = Object.entries(days).slice(0, 5);
  const hourly = fore.list.slice(0, 8);

  document.getElementById('content').innerHTML = `
    <div class="weather-main">
      <div class="current-card">
        <div class="city-name">${cur.name}</div>
        <div class="city-country">${cur.sys.country} · Actualizado ${updated}</div>
        <div class="weather-icon-big">${icon}</div>
        <div class="temp-main">${Math.round(cur.main.temp)}<span class="temp-unit">°C</span></div>
        <div class="weather-desc">${cur.weather[0].description}</div>
        <div class="feels-like">Sensación térmica <span>${Math.round(cur.main.feels_like)}°C</span></div>
        <div class="quick-stats">
          <div class="qs"><div class="qs-label">Mínima</div><div class="qs-val">${Math.round(cur.main.temp_min)}°C</div></div>
          <div class="qs"><div class="qs-label">Máxima</div><div class="qs-val">${Math.round(cur.main.temp_max)}°C</div></div>
          <div class="qs"><div class="qs-label">Humedad</div><div class="qs-val">${cur.main.humidity}%</div></div>
          <div class="qs"><div class="qs-label">Presión</div><div class="qs-val">${cur.main.pressure} hPa</div></div>
        </div>
      </div>
      <div class="sun-card">
        <div class="sun-row"><span class="sun-label">Amanecer</span><span class="sun-icon">🌅</span><span class="sun-val">${sunrise}</span></div>
        <div class="sun-row"><span class="sun-label">Atardecer</span><span class="sun-icon">🌇</span><span class="sun-val">${sunset}</span></div>
        <div class="sun-row"><span class="sun-label">Viento</span><span class="sun-icon">💨</span><span class="sun-val">${(cur.wind.speed * 3.6).toFixed(1)} km/h ${degToDir(cur.wind.deg)}</span></div>
        <div class="sun-row"><span class="sun-label">Visibilidad</span><span class="sun-icon">👁️</span><span class="sun-val">${(cur.visibility/1000).toFixed(1)} km</span></div>
        <div class="sun-row"><span class="sun-label">Nubosidad</span><span class="sun-icon">☁️</span><span class="sun-val">${cur.clouds.all}%</span></div>
        ${cur.rain ? `<div class="sun-row"><span class="sun-label">Lluvia 1h</span><span class="sun-icon">🌧️</span><span class="sun-val">${cur.rain['1h']||0} mm</span></div>` : ''}
      </div>
    </div>

    <div class="section-label">Próximas 24 horas</div>
    <div class="hourly-scroll">
      ${hourly.map((h, i) => {
        const t    = new Date(h.dt * 1000).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
        const ic   = weatherIcon(h.weather[0].id, h.weather[0].icon.includes('d'));
        const rain = h.pop ? Math.round(h.pop * 100) : 0;
        return `<div class="hc">
          <div class="hc-time">${i===0?'Ahora':t}</div>
          <div class="hc-icon">${ic}</div>
          <div class="hc-temp">${Math.round(h.main.temp)}°</div>
          ${rain > 10 ? `<div class="hc-rain">💧${rain}%</div>` : ''}
        </div>`;
      }).join('')}
    </div>

    <div class="section-label">Pronóstico 5 días</div>
    <div class="forecast-grid">
      ${forecastDays.map(([date, items], i) => {
        const temps = items.map(x => x.main.temp);
        const hi  = Math.round(Math.max(...temps));
        const lo  = Math.round(Math.min(...temps));
        const mid = items[Math.floor(items.length / 2)];
        const ic  = weatherIcon(mid.weather[0].id, true);
        const day = i === 0 ? 'Hoy' : new Date(date + 'T12:00:00').toLocaleDateString('es-MX', {weekday:'short'});
        return `<div class="fc">
          <div class="fc-day">${day}</div>
          <div class="fc-icon">${ic}</div>
          <div class="fc-hi">${hi}°</div>
          <div class="fc-lo">${lo}°</div>
          <div class="fc-desc">${mid.weather[0].description}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// HELPERS
function showLoader() {
  document.getElementById('content').innerHTML = `<div class="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
}
function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="status-msg err"><span class="icon">⚠️</span>${msg.replace(/\n/g,'<br>')}</div>`;
}
function weatherIcon(id, isDay = true) {
  if (id >= 200 && id < 300) return '⛈️';
  if (id >= 300 && id < 400) return '🌦️';
  if (id >= 500 && id < 510) return '🌧️';
  if (id === 511)             return '🌨️';
  if (id >= 511 && id < 600) return '🌧️';
  if (id >= 600 && id < 700) return '❄️';
  if (id >= 700 && id < 800) return '🌫️';
  if (id === 800) return isDay ? '☀️' : '🌙';
  if (id === 801) return isDay ? '🌤️' : '🌙';
  if (id === 802) return '⛅';
  if (id >= 803)  return '☁️';
  return '🌡️';
}
function degToDir(deg) {
  return ['N','NE','E','SE','S','SO','O','NO'][Math.round(deg / 45) % 8];
}
</script>
</body>
</html>
